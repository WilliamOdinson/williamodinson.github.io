name: Deploy static Next.js site to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time, in order; a queued run is never cancelled.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. grab the source
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. restore the Turbopack build cache that Next.js keeps in .next/cache
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]sx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      # 3. pnpm, Node, the pnpm store cache and `pnpm install --frozen-lockfile`.
      - name: Set up pnpm and Node, install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      # 4. compile and export the site
      - name: Build website
        run: pnpm run build

      # 5. inject resume PDF from latest release
      - name: Download resume from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download resume --pattern "resume.pdf" --dir out/ --clobber

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out/ --project-name=williamodinson
