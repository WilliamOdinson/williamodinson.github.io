name: Deploy static Next.js site to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time, in order; a queued run is never cancelled.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Next.js keeps its Turbopack build cache in .next/cache.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]sx', '**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      # Also restores the pnpm store cache and runs `pnpm install --frozen-lockfile`.
      - name: Set up pnpm and Node, install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Build website
        run: pnpm run build

      # The résumé PDF comes from the `resume` release unless site.config.mjs hides it.
      - name: Read résumé visibility
        id: resume
        run: |
          hidden=$(node --input-type=module --eval 'import { resume } from "./src/lib/site.config.mjs"; console.log(resume.hidden === true);')
          echo "hidden=$hidden" >> "$GITHUB_OUTPUT"

      - name: Download resume from latest release
        if: steps.resume.outputs.hidden != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download resume --pattern "resume.pdf" --dir out/ --clobber

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out/ --project-name=williamodinson
