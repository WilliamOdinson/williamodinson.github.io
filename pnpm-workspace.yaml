allowBuilds:
  sharp: true
  # Not in the lockfile: cloudflare/wrangler-action runs `pnpm add wrangler`
  # in this project at deploy time, and wrangler depends on both.
  esbuild: true
  workerd: true
overrides:
  mdast-util-to-hast: ">=13.2.1"
  lodash-es: ">=4.18.1"
  prismjs: ">=1.30.0"
  dompurify: ">=3.4.0"
  flatted: ">=3.4.2"
  picomatch: ">=2.3.2 <3.0.0 || >=4.0.4"
  yaml: ">=2.8.3"
  postcss: ">=8.5.10"
